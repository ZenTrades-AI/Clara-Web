document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

b a slot now.<\u002Fem><\u002Fh2>\n        <p style=\"margin:22px 0 0;font-size:16.5px;line-height:1.62;color:#4A4644;max-width:50ch;text-wrap:pretty\">We're keeping a short daily schedule of 15-minute walkthroughs open for contractors who want a real conversation, not a hallway pitch.<\u002Fp>\n\n        <ul style=\"list-style:none;padding:0;margin:36px 0 0;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ checklist }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <li data-row=\"\" style=\"display:flex;gap:18px;align-items:flex-start;padding:20px 12px;margin:0 -12px;border-top:1px solid #EFECEA;border-radius:14px;transition:background .35s ease,padding-left .35s ease\" style-hover=\"background:#FAF8F8;padding-left:22px\">\n              <span style=\"flex:none;width:22px;height:22px;border-radius:999px;border:1px solid #CB2E41;color:#CB2E41;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:2px;font-family:'Instrument Serif',serif;font-style:italic\">{{ c.n }}<\u002Fspan>\n              <span style=\"font-size:16px;line-height:1.55;color:#2A2726\">{{ c.t }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n\n        <sc-if value=\"{{ showBadge }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:36px;border:1px solid #E8E4E2;border-radius:22px;padding:24px 26px;display:flex;gap:20px;align-items:center;background:#FBFAFA;transition:border-color .35s ease,transform .35s ease\" style-hover=\"border-color:#CB2E41\">\n            <div style=\"flex:none;width:60px;height:60px;border-radius:999px;border:1px solid #CB2E41;color:#CB2E41;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-style:italic;font-size:20px\">45<\u002Fdiv>\n            <p style=\"margin:0;font-size:14px;line-height:1.55;color:#4A4644\">Clara AI is a proud exhibitor at the American Fire Sprinkler Association's 45th Annual Convention &amp; Exhibition.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <aside data-reveal=\"\" data-delay=\"120\" data-boothaside=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);background:#0B0B0B;color:#fff;border-radius:28px;padding:clamp(28px,3vw,40px);position:sticky;top:104px;overflow:hidden\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px\">\n          <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#9A9694\">Booth No. 1<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#CB2E41\">{{ countdownShort }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(28px,3.4vw,40px);line-height:1.08;margin-top:16px\">Fifteen minutes,<br>on the floor.<\u002Fdiv>\n\n        <div style=\"margin-top:28px;font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;color:#7E7A78\">Pick a day<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n          <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ d.pick }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:22px;font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;color:#7E7A78\">Pick a time<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n          <sc-for list=\"{{ times }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:26px;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ boothRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-top:1px solid rgba(255,255,255,0.13)\">\n              <span style=\"font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:#8E8A88;flex:none\">{{ r.k }}<\u002Fspan>\n              <span style=\"font-size:14px;text-align:right;color:#F2F0EF\">{{ r.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <a href=\"#booth\" data-magnetic=\"\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;background:#CB2E41;color:#fff;padding:17px 24px;border-radius:999px;font-size:15px;font-weight:500;transition:background .3s ease,color .3s ease\" style-hover=\"background:#fff;color:#0B0B0B\">{{ bookLabel }}<\u002Fa>\n        <p style=\"margin:18px 0 0;font-size:13px;line-height:1.55;color:#8E8A88\">Prefer to talk before the show? Reach out any time — we'll bring the demo to you.<\u002Fp>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showEventStrip }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-reveal=\"\" style=\"opacity:0;transform:translateY(22px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:1px;background:#E8E4E2;border-top:1px solid #E8E4E2;border-bottom:1px solid #E8E4E2;margin:clamp(64px,8vw,104px) 0 0\">\n      <sc-for list=\"{{ strip }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;padding:28px 22px;transition:background .35s ease\" style-hover=\"background:#FAF8F8\">\n          <div style=\"font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;color:#8E8A88\">{{ s.k }}<\u002Fdiv>\n          <div style=\"margin-top:10px;font-size:16px;font-weight:500\">{{ s.v }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <section id=\"agents\" style=\"padding:clamp(72px,9vw,128px) 0 0;scroll-margin-top:96px\">\n    <div data-reveal=\"\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)\">\n      <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#CB2E41\">On the Show Floor<\u002Fdiv>\n      <h2 style=\"font-weight:500;font-size:clamp(32px,4.6vw,60px);line-height:1.04;letter-spacing:-0.035em;margin:18px 0 0;max-width:21ch\">Three agents, built for a trade that runs on <em style=\"font-family:'Instrument Serif',serif;font-style:italic\">trucks and inspections.<\u002Fem><\u002Fh2>\n      <p style=\"margin:22px 0 0;font-size:16.5px;line-height:1.62;color:#4A4644;max-width:60ch;text-wrap:pretty\">Clara isn't a chatbot bolted onto a phone line — it's an operating layer built specifically for merit-shop trades. At the booth, we'll run all three live.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" data-delay=\"100\" style=\"opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);margin-top:clamp(32px,4vw,52px);border-top:1px solid #E8E4E2\">\n      <sc-for list=\"{{ agentRows }}\" as=\"a\" hint-placeholder-count=\"3\">\n        <div sc-camel-on-mouse-enter=\"{{ a.open }}\" sc-camel-on-click=\"{{ a.open }}\" style=\"{{ a.rowStyle }}\">\n          <div style=\"display:grid;grid-template-columns:auto 1fr auto;gap:clamp(16px,3vw,40px);align-items:center\">\n            <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(20px,2.4vw,30px);color:#CB2E41;min-width:44px\">{{ a.num }}<\u002Fspan>\n            <div>\n              <div style=\"font-size:clamp(24px,3.2vw,40px);font-weight:500;letter-spacing:-0.03em;line-height:1.1\">{{ a.title }}<\u002Fdiv>\n              <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(16px,1.6vw,20px);color:#6A6664;margin-top:6px\">{{ a.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n            <span data-arrow=\"\" style=\"{{ a.dotStyle }}\">→<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"{{ a.panelStyle }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:24px;padding:24px 0 8px 0\">\n              <p style=\"margin:0;font-size:16px;line-height:1.62;color:#4A4644;max-width:52ch;text-wrap:pretty\">{{ a.body }}<\u002Fp>\n              <div style=\"display:flex;align-items:flex-start;justify-content:flex-start\">\n                <span style=\"display:inline-flex;align-items:center;gap:10px;border:1px solid #E6E2E0;border-radius:999px;padding:9px 18px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#5C5856\">Live at booth · {{ a.tie }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"crew\" style=\"padding:clamp(72px,9vw,128px) 0 0;scroll-margin-top:96px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(28px,4vw,64px);align-items:end\">\n      <div data-reveal=\"\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)\">\n        <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#CB2E41\">The Full Crew<\u002Fdiv>\n        <h2 style=\"font-weight:500;font-size:clamp(30px,4.2vw,54px);line-height:1.04;letter-spacing:-0.035em;margin:18px 0 0;max-width:18ch\">Eight AI employees. <em style=\"font-family:'Instrument Serif',serif;font-style:italic\">Three on the floor.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <p data-reveal=\"\" data-delay=\"80\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);margin:0;font-size:16.5px;line-height:1.62;color:#4A4644;max-width:52ch;text-wrap:pretty\">Clara staffs the workflow, not the job title — from the first ring through dispatch, the deficiency quote, and the invoice that finally gets paid. Fire protection first, and the same loop runs for HVAC, electrical, plumbing, facility, security, elevator and dock contractors.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" data-delay=\"140\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px;margin-top:clamp(32px,4vw,52px)\">\n      <sc-for list=\"{{ crew }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <div style=\"{{ c.style }}\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n            <span style=\"font-size:17px;font-weight:500;letter-spacing:-0.01em\">{{ c.name }}<\u002Fspan>\n            <span style=\"{{ c.badge }}\">{{ c.badgeText }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:10px;font-size:13.5px;line-height:1.5;color:#6A6664\">{{ c.job }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"signals\" style=\"padding:clamp(72px,9vw,128px) 0 0;scroll-margin-top:96px\">\n    <div data-reveal=\"\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)\">\n      <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#CB2E41\">Bring Us Your Worst Workflow<\u002Fdiv>\n      <h2 style=\"font-weight:500;font-size:clamp(30px,4.2vw,54px);line-height:1.04;letter-spacing:-0.035em;margin:18px 0 0;max-width:20ch\">If you've said one of these out loud, <em style=\"font-family:'Instrument Serif',serif;font-style:italic\">we'll demo the fix.<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <div data-reveal=\"\" data-delay=\"100\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);margin-top:clamp(30px,4vw,48px);border-top:1px solid #E8E4E2\">\n      <sc-for list=\"{{ signals }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <div data-signalrow=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 14px;margin:0 -14px;border-bottom:1px solid #EFECEA;border-radius:14px;transition:background .35s ease,padding-left .35s ease\" style-hover=\"background:#FAF8F8;padding-left:26px\">\n          <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(19px,2.2vw,27px);line-height:1.3;color:#1A1817\">{{ s.quote }}<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:9px;border:1px solid #E6E2E0;border-radius:999px;padding:8px 16px;font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:#4A4644;white-space:nowrap;transition:background .3s ease,color .3s ease,border-color .3s ease\" style-hover=\"background:#CB2E41;color:#fff;border-color:#CB2E41\">{{ s.agent }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"proof\" style=\"padding:clamp(72px,9vw,128px) 0 0;scroll-margin-top:96px\">\n    <div data-reveal=\"\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)\">\n      <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#CB2E41\">Already Running In Fire Protection<\u002Fdiv>\n      <h2 style=\"font-weight:500;font-size:clamp(32px,4.6vw,60px);line-height:1.04;letter-spacing:-0.035em;margin:18px 0 0;max-width:19ch\">Not a pitch. <em style=\"font-family:'Instrument Serif',serif;font-style:italic\">Two contractors<\u002Fem> already running Clara.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(24px,4vw,56px);margin-top:clamp(36px,4.6vw,60px)\">\n      <sc-for list=\"{{ proof }}\" as=\"p\" hint-placeholder-count=\"2\">\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);border-top:2px solid #0B0B0B;padding:30px 0 0\">\n          <div data-count=\"{{ p.value }}\" data-suffix=\"%\" style=\"font-family:'Instrument Serif',serif;font-size:clamp(70px,10vw,124px);line-height:0.88;letter-spacing:-0.04em;color:#CB2E41\">0%<\u002Fdiv>\n          <p style=\"margin:26px 0 0;font-size:16.5px;line-height:1.6;color:#2A2726;max-width:40ch;text-wrap:pretty\">{{ p.desc }}<\u002Fp>\n          <div style=\"margin-top:20px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#8E8A88\">{{ p.customer }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-reveal=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);margin-top:clamp(80px,10vw,140px);background:#0B0B0B;color:#fff;border-radius:32px;padding:clamp(40px,6vw,84px);position:relative;overflow:hidden\">\n    <div style=\"position:absolute;right:-60px;top:-60px;width:320px;height:320px;border:1px solid rgba(203,46,65,0.5);border-radius:999px;pointer-events:none\" data-float=\"0.08\"><\u002Fdiv>\n    <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#CB2E41\">Booth 1 · Exhibition Hall<\u002Fdiv>\n    <h2 style=\"font-weight:500;font-size:clamp(34px,5.6vw,76px);line-height:1.02;letter-spacing:-0.04em;margin:20px 0 0;max-width:16ch\">Come watch an AI <em style=\"font-family:'Instrument Serif',serif;font-style:italic\">work a shift.<\u002Fem><\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:34px\">\n      <a href=\"#booth\" data-magnetic=\"\" style=\"display:inline-flex;align-items:center;gap:10px;background:#CB2E41;color:#fff;padding:17px 30px;border-radius:999px;font-size:15px;font-weight:500;transition:background .3s ease,color .3s ease\" style-hover=\"background:#fff;color:#0B0B0B\">Reserve a Booth Meeting →<\u002Fa>\n      <a href=\"#agents\" style=\"display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,0.28);color:#fff;padding:17px 30px;border-radius:999px;font-size:15px;font-weight:500;transition:border-color .3s ease,background .3s ease\" style-hover=\"border-color:#fff;background:rgba(255,255,255,0.06)\">See What We're Demoing<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"margin:clamp(72px,8vw,110px) 0 0;border-top:1px solid #E8E4E2;padding:60px 0 40px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:44px\">\n      <div>\n        <div style=\"font-size:18px;font-weight:600;letter-spacing:0.16em\">CLARA <span style=\"color:#CB2E41\">AI<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:20px 0 0;font-family:'Instrument Serif',serif;font-style:italic;font-size:24px;line-height:1.25;max-width:20ch\">The only AI your trades business needs. From first ring to final payment.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#8E8A88;margin-bottom:6px\">Product<\u002Fdiv>\n        <a href=\"#agents\" style=\"color:#2A2726;font-size:15px\" style-hover=\"color:#CB2E41\">Field Co-Pilot<\u002Fa>\n        <a href=\"#agents\" style=\"color:#2A2726;font-size:15px\" style-hover=\"color:#CB2E41\">Clara Answers<\u002Fa>\n        <a href=\"#agents\" style=\"color:#2A2726;font-size:15px\" style-hover=\"color:#CB2E41\">Clara Collects<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#8E8A88;margin-bottom:6px\">AFSA45<\u002Fdiv>\n        <a href=\"#booth\" style=\"color:#2A2726;font-size:15px\" style-hover=\"color:#CB2E41\">Book a Meeting<\u002Fa>\n        <a href=\"#agents\" style=\"color:#2A2726;font-size:15px\" style-hover=\"color:#CB2E41\">Live Demos<\u002Fa>\n        <a href=\"#booth\" style=\"color:#2A2726;font-size:15px\" style-hover=\"color:#CB2E41\">Exhibitor Info<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#8E8A88;margin-bottom:6px\">Company<\u002Fdiv>\n        <div style=\"color:#2A2726;font-size:15px\">415 Mission St, Fl #37<\u002Fdiv>\n        <div style=\"color:#2A2726;font-size:15px\">San Francisco, CA 94105<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:52px;padding-top:24px;border-top:1px solid #EFECEA;font-size:12.5px;color:#8E8A88\">\n      <span>© 2026 Clara AI. All rights reserved.<\u002Fspan>\n      <span>AFSA45 is produced by the American Fire Sprinkler Association.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPhotos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showEventStrip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showBadge&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: 0, day: \"Sun 27\", time: \"10:30 AM\", now: Date.now() };\n\n  componentDidMount() {\n    this._t = setInterval(() => this.setState({ now: Date.now() }), 1000);\n    const root = this.el || document;\n    requestAnimationFrame(() => this.wire(root));\n    setTimeout(() => this.wire(root), 600);\n  }\n  componentWillUnmount() {\n    clearInterval(this._t);\n    if (this._io) this._io.disconnect();\n    if (this._onScroll) window.removeEventListener(\"scroll\", this._onScroll);\n  }\n\n  wire(root) {\n    const q = (s) => Array.from(document.querySelectorAll(s));\n\n    if (!this._io) {\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (!e.isIntersecting) return;\n          const el = e.target, d = parseInt(el.getAttribute(\"data-delay\") || \"0\", 10);\n          setTimeout(() => { el.style.opacity = \"1\"; el.style.transform = \"translateY(0)\"; }, d);\n          const u = el.querySelector && el.querySelector(\"[data-underline]\");\n          if (u) setTimeout(() => { u.style.transform = \"scaleX(1)\"; }, d);\n          this._io.unobserve(el);\n        });\n      }, { threshold: 0.15, rootMargin: \"0px 0px -8% 0px\" });\n    }\n    q(\"[data-reveal]\").forEach((el) => { if (!el._rv) { el._rv = 1; this._io.observe(el); } });\n\n    // failsafe: never leave content hidden\n    setTimeout(() => q(\"[data-reveal]\").forEach((el) => { el.style.opacity = \"1\"; el.style.transform = \"translateY(0)\"; }), 4000);\n\n    // counters\n    const cio = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        const el = e.target, target = parseFloat(el.getAttribute(\"data-count\")) || 0;\n        const suffix = el.getAttribute(\"data-suffix\") || \"\", start = performance.now(), dur = 1400;\n        const step = (t) => {\n          const p = Math.min(1, (t - start) / dur), eased = 1 - Math.pow(1 - p, 3);\n          el.textContent = Math.round(target * eased) + suffix;\n          if (p < 1) requestAnimationFrame(step);\n        };\n        requestAnimationFrame(step);\n        cio.unobserve(el);\n      });\n    }, { threshold: 0.5 });\n    q(\"[data-count]\").forEach((el) => { if (!el._cv) { el._cv = 1; cio.observe(el); } });\n\n    // magnetic buttons\n    q(\"[data-magnetic]\").forEach((el) => {\n      if (el._mg) return;\n      el._mg = 1;\n      el.addEventListener(\"mousemove\", (ev) => {\n        const r = el.getBoundingClientRect();\n        el.style.transform = `translate(${(ev.clientX - r.left - r.width / 2) * 0.16}px, ${(ev.clientY - r.top - r.height / 2) * 0.22}px)`;\n      });\n      el.addEventListener(\"mouseleave\", () => { el.style.transform = \"translate(0,0)\"; });\n    });\n\n    // tilt cards\n    q(\"[data-tilt]\").forEach((el) => {\n      if (el._tl) return;\n      el._tl = 1;\n      el.addEventListener(\"mousemove\", (ev) => {\n        const r = el.getBoundingClientRect();\n        const px = (ev.clientX - r.left) / r.width - 0.5, py = (ev.clientY - r.top) / r.height - 0.5;\n        el.style.transform = `perspective(900px) rotateX(${(-py * 6).toFixed(2)}deg) rotateY(${(px * 8).toFixed(2)}deg) translateY(-4px)`;\n      });\n      el.addEventListener(\"mouseleave\", () => { el.style.transform = \"perspective(900px) rotateX(0) rotateY(0) translateY(0)\"; });\n    });\n\n    // nav links appear on wide viewports\n    const nl = document.querySelector(\"[data-navlinks]\");\n    const hg = document.querySelector(\"[data-herogrid]\");\n    const set = (sel, fn) => q(sel).forEach(fn);\n    const sizeNav = () => {\n      const w = window.innerWidth;\n      if (nl) nl.style.display = w > 1000 ? \"flex\" : \"none\";\n      if (hg) hg.style.gridTemplateColumns = w > 820 ? \"minmax(0,1.15fr) minmax(300px,0.85fr)\" : \"minmax(0,1fr)\";\n      set(\"[data-navcd]\", (el) => { el.style.display = w > 760 ? \"flex\" : \"none\"; });\n      set(\"[data-navcta]\", (el) => {\n        el.style.padding = w > 620 ? \"12px 22px\" : \"10px 16px\";\n        el.style.fontSize = w > 620 ? \"13.5px\" : \"12px\";\n        el.style.whiteSpace = \"nowrap\";\n      });\n      set(\"[data-boothaside]\", (el) => { el.style.position = w > 900 ? \"sticky\" : \"static\"; });\n      set(\"[data-arrow]\", (el) => { el.style.display = w > 620 ? \"flex\" : \"none\"; });\n      set(\"[data-signalrow]\", (el) => {\n        el.style.gridTemplateColumns = w > 680 ? \"minmax(0,1fr) auto\" : \"minmax(0,1fr)\";\n        el.style.justifyItems = w > 680 ? \"stretch\" : \"start\";\n        el.style.gap = w > 680 ? \"20px\" : \"12px\";\n      });\n      set(\"[data-ticketrow]\", (el) => {\n        el.style.flexWrap = w > 420 ? \"nowrap\" : \"wrap\";\n        el.style.gap = w > 420 ? \"20px\" : \"14px\";\n      });\n      // touch devices: drop hover-only transforms\n      if (!window.matchMedia(\"(hover: hover)\").matches) {\n        set(\"[data-tilt]\", (el) => { el.style.transform = \"none\"; });\n        set(\"[data-magnetic]\", (el) => { el.style.transform = \"none\"; });\n      }\n    };\n    sizeNav();\n    if (!this._rs) { this._rs = 1; window.addEventListener(\"resize\", sizeNav); }\n\n    if (!this._onScroll) {\n      const bar = document.querySelector(\"[data-progress]\");\n      const nav = document.querySelector(\"[data-nav]\");\n      this._onScroll = () => {\n        const y = window.scrollY || document.documentElement.scrollTop;\n        const h = document.documentElement.scrollHeight - window.innerHeight;\n        if (bar) bar.style.width = (h > 0 ? (y / h) * 100 : 0) + \"%\";\n        if (nav) nav.style.borderBottomColor = y > 24 ? \"#EFECEA\" : \"transparent\";\n        q(\"[data-parallax]\").forEach((el) => {\n          const r = el.parentElement.getBoundingClientRect();\n          const off = (r.top + r.height / 2 - window.innerHeight / 2) * parseFloat(el.getAttribute(\"data-parallax\"));\n          el.style.transform = `translate3d(0, ${off}px, 0)`;\n        });\n        q(\"[data-float]\").forEach((el) => {\n          el.style.transform = `translate3d(0, ${y * parseFloat(el.getAttribute(\"data-float\"))}px, 0)`;\n        });\n      };\n      window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n      this._onScroll();\n    }\n  }\n\n  chip(active, dark) {\n    return [\n      \"border-radius:999px\", \"padding:10px 16px\", \"font-size:13px\", \"font-family:inherit\", \"cursor:pointer\",\n      \"transition:background .25s ease,color .25s ease,border-color .25s ease\",\n      active ? \"background:#CB2E41;color:#fff;border:1px solid #CB2E41\" : \"background:transparent;color:#C9C5C3;border:1px solid rgba(255,255,255,0.22)\"\n    ].join(\";\");\n  }\n\n  renderVals() {\n    const agents = [\n      { num: \"01\", title: \"Field Co-Pilot\", sub: \"Your AI assistant in the field\", body: \"Hands-free ITM capture, guided inspection workflows, deficiency notes written as the tech walks the system — and reports that sync to ServiceTitan, Jobber or FieldEdge before the truck leaves the lot.\", tie: \"ITM, deficiencies & field documentation\" },\n      { num: \"02\", title: \"Clara Answers\", sub: \"Never miss a call again\", body: \"Inspection requests, service calls and the 2am flow-alarm — answered in seconds, qualified against your service area, and booked straight onto the dispatch board. Nights, weekends, storm volume.\", tie: \"Inbound & after-hours coverage\" },\n      { num: \"03\", title: \"Clara Collects\", sub: \"Get paid without the awkward call\", body: \"Professional follow-up across voice, text and email on commercial AR — net-60 cycles, retainage and the invoices your office manager keeps meaning to chase. Not consumer dunning.\", tie: \"Commercial AR & retainage\" }\n    ];\n    const open = this.state.open;\n\n    const target = new Date(\"2026-09-27T09:00:00-05:00\").getTime();\n    const diff = Math.max(0, target - this.state.now);\n    const d = Math.floor(diff / 86400000), h = Math.floor(diff / 3600000) % 24, m = Math.floor(diff / 60000) % 60, s = Math.floor(diff / 1000) % 60;\n\n    const mk = (label, key, sel) => ({\n      label, style: this.chip(sel === label),\n      pick: () => this.setState({ [key]: label })\n    });\n\n    return {\n      showPhotos: this.props.showPhotos ?? true,\n      showEventStrip: this.props.showEventStrip ?? true,\n      showBadge: this.props.showBadge ?? true,\n      countdownShort: diff > 0 ? d + \"d \" + h + \"h to doors\" : \"Live at AFSA45\",\n      countdownLong: diff > 0 ? d + \"d \" + h + \"h \" + m + \"m \" + s + \"s\" : \"Happening now\",\n      heroFacts: [\n        { v: \"8\", k: \"AI employees on staff\" },\n        { v: \"3\", k: \"Running live at Booth 1\" },\n        { v: \"15 min\", k: \"Per booth walkthrough\" }\n      ],\n      waves: Array.from({ length: 28 }, (_, i) => ({\n        style: \"flex:1;min-width:2px;height:100%;border-radius:999px;transform-origin:center;background:\" +\n          (i % 5 === 0 ? \"#CB2E41\" : \"rgba(255,255,255,0.35)\") +\n          \";animation:clara-wave \" + (0.9 + (i % 7) * 0.13).toFixed(2) + \"s ease-in-out \" + ((i % 9) * 0.08).toFixed(2) + \"s infinite\"\n      })),\n      transcript: [\"\\u201CSprinkler flow alarm at the Westside warehouse — can someone come out tonight?\\u201D\", \"\\u201CGot it. I have a tech 20 minutes away — booking you for 6:40 AM.\\u201D\", \"\\u201CConfirmed. Work order created and synced to your CRM.\\u201D\"][Math.floor(this.state.now / 3200) % 3],\n      callTimer: \"00:\" + String(Math.floor(this.state.now / 1000) % 60).padStart(2, \"0\"),\n      ticker: [\"AFSA45\", \"Booth 1\", \"Sept 27–30\", \"San Antonio\", \"ITM & Inspections\", \"Deficiency Quotes\", \"Dispatch\", \"Commercial AR\", \"Live Demos\"],\n      barcode: Array.from({ length: 34 }, (_, i) => ({\n        style: \"flex:1;border-radius:1px;background:\" + (i % 7 === 0 ? \"#CB2E41\" : \"#DCD7D5\") + \";height:\" + (6 + ((i * 37) % 11)) + \"px\"\n      })),\n      crew: [\n        { name: \"Clara Answers\", job: \"Inbound, inspection requests and after-hours calls\", live: true },\n        { name: \"Field Co-Pilot\", job: \"Technician support and field documentation\"
